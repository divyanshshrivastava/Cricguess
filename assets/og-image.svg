<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e3d22"/>
      <stop offset="50%" stop-color="#1a5632"/>
      <stop offset="100%" stop-color="#0f1923"/>
    </linearGradient>
    <linearGradient id="ball" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d4585a"/>
      <stop offset="100%" stop-color="#b5383a"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Decorative circles -->
  <circle cx="1050" cy="150" r="280" fill="#2d8a56" opacity="0.15"/>
  <circle cx="150" cy="500" r="200" fill="#b5383a" opacity="0.1"/>

  <!-- Brand Title -->
  <text x="120" y="240" font-family="Outfit, -apple-system, sans-serif" font-size="100" font-weight="800" fill="#ffffff" letter-spacing="-2">
    Cric<tspan fill="#d4585a">Guess</tspan> 🏏
  </text>

  <!-- Tagline -->
  <text x="125" y="320" font-family="Inter, -apple-system, sans-serif" font-size="38" font-weight="600" fill="#f5f0e8">
    Guess the Mystery Cricketer from 6 Clues!
  </text>

  <!-- Subtitle -->
  <text x="125" y="380" font-family="Inter, -apple-system, sans-serif" font-size="24" fill="#b0aaa0">
    Daily Challenge • Unlimited Practice • Real Cricket Trivia
  </text>

  <!-- Clue badge preview cards -->
  <g transform="translate(125, 430)">
    <rect x="0" y="0" width="140" height="60" rx="12" fill="#1a2e3d" stroke="#2a4a5e" stroke-width="2"/>
    <text x="70" y="38" font-family="Outfit, sans-serif" font-size="20" font-weight="700" fill="#22c55e" text-anchor="middle">🟩 CLUE 1</text>

    <rect x="160" y="0" width="140" height="60" rx="12" fill="#1a2e3d" stroke="#2a4a5e" stroke-width="2"/>
    <text x="230" y="38" font-family="Outfit, sans-serif" font-size="20" font-weight="700" fill="#e8e6e1" text-anchor="middle">CLUE 2</text>

    <rect x="320" y="0" width="140" height="60" rx="12" fill="#1a2e3d" stroke="#2a4a5e" stroke-width="2"/>
    <text x="390" y="38" font-family="Outfit, sans-serif" font-size="20" font-weight="700" fill="#e8e6e1" text-anchor="middle">CLUE 3</text>

    <rect x="480" y="0" width="140" height="60" rx="12" fill="#1a2e3d" stroke="#2a4a5e" stroke-width="2"/>
    <text x="550" y="38" font-family="Outfit, sans-serif" font-size="20" font-weight="700" fill="#e8e6e1" text-anchor="middle">CLUE 4</text>

    <rect x="640" y="0" width="140" height="60" rx="12" fill="#1a2e3d" stroke="#2a4a5e" stroke-width="2"/>
    <text x="710" y="38" font-family="Outfit, sans-serif" font-size="20" font-weight="700" fill="#e8e6e1" text-anchor="middle">CLUE 5</text>

    <rect x="800" y="0" width="140" height="60" rx="12" fill="#1a2e3d" stroke="#d4a054" stroke-width="2"/>
    <text x="870" y="38" font-family="Outfit, sans-serif" font-size="20" font-weight="700" fill="#d4a054" text-anchor="middle">⭐ CLUE 6</text>
  </g>
</svg>
